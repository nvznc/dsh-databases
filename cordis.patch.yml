# dsh-databases bundle: monta el servidor MCP de bases de datos.
#
# Credenciales: NO van aquí. El servidor las lee de su .env, de
# configs/connections.json o de las conexiones guardadas con save_connection.
#
# Este paquete usa `dsh.bundle.patch`, así que está pensado para instalarse como
# plugin (market o `dsh plugin add`). Los campos del config se aplican tal cual;
# si mueves el paquete a otra ruta, ajusta `args`/`cwd`.
- insert:
    - id: mcp-databases
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: db
        transport: stdio
        command: 'node'
        args:
          - 'C:/Users/Antho/Downloads/mcp-sql/dist/index.js'
        cwd: 'C:/Users/Antho/Downloads/mcp-sql'
        toolCallTimeoutMs: 120000
